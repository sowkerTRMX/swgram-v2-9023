name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch official TDLib Android AAR
        run: |
          set -e
          mkdir -p app/libs
          URL=$(curl -s https://api.github.com/repos/tdlibx/td/releases/latest \
                | grep -o '"browser_download_url": *"[^"]*\.aar"' \
                | head -1 | cut -d'"' -f4)
          if [ -z "$URL" ]; then
            echo "NO_AAR_IN_LATEST_RELEASE"
            curl -s https://api.github.com/repos/tdlibx/td/releases | head -60
            exit 1
          fi
          echo "downloading $URL"
          curl -fL "$URL" -o app/libs/tdlib.aar
          ls -la app/libs/
          unzip -l app/libs/tdlib.aar | head -20
          unzip -l app/libs/tdlib.aar | grep -q "libtdjni.so" || { echo "AAR_HAS_NO_JNI"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect
        if: always()
        run: |
          mkdir -p artifact
          find . -name "*.apk" -type f -exec cp {} artifact/ \; 2>/dev/null || true
          cp build.log artifact/ 2>/dev/null || true
          ls -la artifact/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swgram
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
